version: "3"
services:
  react_template_service:
    container_name: react_template_container_${STAGE}
    image: react_template_image_${STAGE}:${APP_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
      target: react_template_image_${STAGE}
    user: node
    working_dir: /home/node/Project/
    privileged: true
    volumes:
      - ./src:/home/node/Project/src:rw
      - ./scripts:/home/node/Project/scripts:rw
    expose:
      - "3000"
    ports:
      - "3000:3000"
    tty: true
    entrypoint:
      - bash
      - -c
    command: >
      "tail -f /dev/null"
    networks:
      - app_network  # ここを追加

networks:
  app_network:
    external: true